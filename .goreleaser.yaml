# GoReleaser configuration for secret_inject
# https://goreleaser.com
version: 2
project_name: secret_inject

builds:
  - id: linux
    env:
      - CGO_ENABLED=0
    main: ./cmd/secret_inject
    ldflags:
      - -s -w
      - -X 'main.Version={{ .Version }}'
      - -X 'main.GitCommit={{ .Commit }}'
      - -X 'main.BuildDate={{ .Date }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: darwin-arm64
    env:
      - CGO_ENABLED=1
      - CC=/usr/bin/clang
      - CGO_CFLAGS=-arch arm64
      - CGO_LDFLAGS=-arch arm64
    main: ./cmd/secret_inject
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w
      - -X 'main.Version={{ .Version }}'
      - -X 'main.GitCommit={{ .Commit }}'
      - -X 'main.BuildDate={{ .Date }}'
  - id: darwin-amd64
    env:
      - CGO_ENABLED=1
      - CC=/usr/bin/clang
      - CGO_CFLAGS=-arch x86_64
      - CGO_LDFLAGS=-arch x86_64
    main: ./cmd/secret_inject
    goos: [darwin]
    goarch: [amd64]
    ldflags:
      - -s -w
      - -X 'main.Version={{ .Version }}'
      - -X 'main.GitCommit={{ .Commit }}'
      - -X 'main.BuildDate={{ .Date }}'

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: true
  prerelease: auto