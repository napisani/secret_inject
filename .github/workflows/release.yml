# Go release workflow using goreleaser
# Creates GitHub releases with cross-platform binaries when tags are pushed

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+*'

jobs:
  goreleaser:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          check-latest: true

      - name: Test native-capable code
        run: go test -race ./... && go vet ./...

      - name: Require certified native and provider conformance
        run: go test -tags releasegate ./internal/source ./internal/storage

      - name: Build release-capability fixtures
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean

      - name: Verify both macOS binaries retain native capability
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            binary=$(find dist -type f -path "*darwin_${architecture}*" -name secret_inject | head -n 1)
            test -n "$binary"
            go version -m "$binary" | grep -q 'CGO_ENABLED=1'
            otool -L "$binary" | grep -q 'Security.framework'
            otool -L "$binary" | grep -q 'CoreFoundation.framework'
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}